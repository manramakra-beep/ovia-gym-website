<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — OVIA GYM</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-box {
    width: 100%;
    max-width: 380px;
    background: var(--bg-panel);
    border: 1px solid var(--steel);
    padding: 40px;
  }
  .login-box .logo { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 8px; }
  .login-box .logo span { color: var(--crimson); }
  .login-box .sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }
  .btn-block { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <div class="logo">OVIA<span>GYM</span></div>
    <div class="sub">Staff login</div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
      <p class="form-status" id="form-status"></p>
    </form>

    <p style="margin-top:24px;"><a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">← Back to site</a></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js"></script>
<script src="../js/supabase-client.js"></script>
<script>
  // If already logged in, go straight to dashboard
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('form-status');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    status.textContent = 'Logging in...';
    status.className = 'form-status';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      status.textContent = error.message;
      status.className = 'form-status error';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
